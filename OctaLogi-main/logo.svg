<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Brilho Neon e Sombras Pro -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Gradientes Vibrantes -->
    <radialGradient id="badgeBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2E1065" />
      <stop offset="70%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>

    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="octopusBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>

    <linearGradient id="helmetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="60%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
  </defs>

  <!-- Fundo Circular do Badge com Neon -->
  <circle cx="256" cy="256" r="242" fill="url(#badgeBg)" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#neonBorder)" stroke-width="12" filter="url(#neonGlow)" />

  <!-- Sombra no Chão -->
  <ellipse cx="256" cy="450" rx="160" ry="22" fill="#000000" opacity="0.45" />

  <!-- MASCOTE POLVO (MAIOR & MAIS PREENCHIDO) -->
  <g id="mascotGroup">

    <!-- Tentáculos Traseiros / Base -->
    <path d="M120 340 C70 370 60 440 120 455 C170 465 190 390 180 340 Z" fill="url(#octopusBody)" />
    <path d="M392 340 C442 370 452 440 392 455 C342 465 322 390 332 340 Z" fill="url(#octopusBody)" />

    <!-- Tentáculos Frontais Principais -->
    <path d="M190 330 C150 400 140 465 205 470 C245 472 240 400 230 330 Z" fill="url(#octopusBody)" />
    <circle cx="168" cy="435" r="11" fill="#F472B6" />
    <circle cx="192" cy="455" r="9.5" fill="#F472B6" />

    <path d="M322 330 C362 400 372 465 307 470 C267 472 272 400 282 330 Z" fill="url(#octopusBody)" />
    <circle cx="344" cy="435" r="11" fill="#F472B6" />
    <circle cx="320" cy="455" r="9.5" fill="#F472B6" />

    <!-- Tentáculo Esquerdo Segurando Prancheta -->
    <path d="M165 290 C95 290 50 320 65 385 C80 430 145 390 185 340 Z" fill="url(#octopusBody)" />
    <circle cx="78" cy="370" r="10" fill="#F472B6" />

    <!-- Tentáculo Direito Segurando Caixa -->
    <path d="M347 290 C417 290 462 320 447 385 C432 430 367 390 327 340 Z" fill="url(#octopusBody)" />
    <circle cx="434" cy="370" r="10" fill="#F472B6" />

    <!-- Cabeça Gigante Fofa -->
    <path d="M146 220 C146 110 366 110 366 220 C366 315 340 375 256 375 C172 375 146 315 146 220 Z" fill="url(#octopusBody)" stroke="#581C87" stroke-width="4" />

    <!-- OLHOS GRANDES E BRILHANTES -->
    <!-- Olho Esquerdo -->
    <g id="leftEye">
      <ellipse cx="208" cy="210" rx="30" ry="36" fill="#FFFFFF" stroke="#3B0764" stroke-width="3" />
      <ellipse cx="214" cy="212" rx="19" ry="23" fill="#0284C7" />
      <ellipse cx="217" cy="214" rx="12" ry="15" fill="#0F172A" />
      <circle cx="223" cy="200" r="7" fill="#FFFFFF" />
      <circle cx="204" cy="224" r="3.5" fill="#FFFFFF" />
    </g>

    <!-- Olho Direito -->
    <g id="rightEye">
      <ellipse cx="304" cy="210" rx="30" ry="36" fill="#FFFFFF" stroke="#3B0764" stroke-width="3" />
      <ellipse cx="298" cy="212" rx="19" ry="23" fill="#0284C7" />
      <ellipse cx="295" cy="214" rx="12" ry="15" fill="#0F172A" />
      <circle cx="301" cy="200" r="7" fill="#FFFFFF" />
      <circle cx="282" cy="224" r="3.5" fill="#FFFFFF" />
    </g>

    <!-- Sobrancelhas Marcantes -->
    <path d="M182 165 Q208 152 228 167" stroke="#3B0764" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M330 165 Q304 152 284 167" stroke="#3B0764" stroke-width="6" stroke-linecap="round" fill="none" />

    <!-- Bochechas Rosadas Fofas -->
    <ellipse cx="176" cy="245" rx="18" ry="11" fill="#F472B6" opacity="0.8" />
    <ellipse cx="336" cy="245" rx="18" ry="11" fill="#F472B6" opacity="0.8" />

    <!-- Sorriso Aberto e Alegre -->
    <path d="M224 248 Q256 288 288 248 Z" fill="#881337" stroke="#4C0519" stroke-width="3" />
    <path d="M236 265 Q256 282 276 265 Z" fill="#FB7185" />

    <!-- CAPACETE DE SEGURANÇA AMARELO GRANDE -->
    <g id="helmet" filter="url(#dropShadow)">
      <path d="M140 160 C140 60 372 60 372 160 Z" fill="url(#helmetGrad)" stroke="#B45309" stroke-width="5" />
      <path d="M232 68 L280 68 C286 115 288 155 286 158 L226 158 C224 155 226 115 232 68 Z" fill="#FEF08A" opacity="0.9" />
      <path d="M118 155 C118 142 394 142 394 155 C394 172 118 172 118 155 Z" fill="#EAB308" stroke="#92400E" stroke-width="5" />
      <path d="M170 95 Q220 80 250 85 C220 100 185 112 170 95 Z" fill="#FFFFFF" opacity="0.45" />
    </g>

    <!-- PRANCHETA LOGÍSTICA (ESQUERDA) -->
    <g id="clipboard" transform="translate(42, 195) rotate(-10)" filter="url(#dropShadow)">
      <rect x="0" y="0" width="105" height="140" rx="10" fill="#B45309" stroke="#78350F" stroke-width="4" />
      <rect x="9" y="16" width="87" height="114" rx="6" fill="#FFFFFF" />
      <rect x="32" y="-8" width="41" height="20" rx="5" fill="#94A3B8" stroke="#334155" stroke-width="3" />
      <circle cx="52.5" cy="2" r="4" fill="#1E293B" />
      <!-- Checklist Verificado -->
      <rect x="18" y="32" width="16" height="16" rx="3" fill="#DCFCE7" stroke="#15803D" stroke-width="2" />
      <path d="M21 40 L26 45 L32 35" stroke="#16A34A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <line x1="40" y1="40" x2="84" y2="40" stroke="#475569" stroke-width="4" stroke-linecap="round" />

      <rect x="18" y="58" width="16" height="16" rx="3" fill="#DCFCE7" stroke="#15803D" stroke-width="2" />
      <path d="M21 66 L26 71 L32 61" stroke="#16A34A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <line x1="40" y1="66" x2="80" y2="66" stroke="#475569" stroke-width="4" stroke-linecap="round" />

      <rect x="18" y="84" width="16" height="16" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" />
      <line x1="40" y1="92" x2="72" y2="92" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- CAIXA DE ENCOMENDA & PIN GPS (DIREITA) -->
    <g id="packageAndPin" transform="translate(305, 205)" filter="url(#dropShadow)">
      <!-- Caixa 3D Papelão -->
      <path d="M20 60 L100 60 L100 135 L20 135 Z" fill="url(#boxGrad)" stroke="#78350F" stroke-width="4" />
      <path d="M20 60 L55 34 L135 34 L100 60 Z" fill="#FBBF24" stroke="#B45309" stroke-width="3" />
      <path d="M100 60 L135 34 L135 109 L100 135 Z" fill="#92400E" stroke="#451A03" stroke-width="3" />
      <path d="M60 36 L60 135" stroke="#78350F" stroke-width="6" opacity="0.6" />

      <!-- PIN GPS NEON DESTACADO -->
      <g id="gpsPin" transform="translate(85, -35)" filter="url(#neonGlow)">
        <path d="M42 0 C18.8 0 0 18.8 0 42 C0 74 42 114 42 114 C42 114 84 74 84 42 C84 18.8 65.2 0 42 0 Z" fill="url(#pinGrad)" stroke="#FFFFFF" stroke-width="3" />
        <circle cx="42" cy="40" r="17" fill="#0F172A" />
        <circle cx="42" cy="40" r="8.5" fill="#FFFFFF" />
      </g>
    </g>

  </g>
</svg>
